<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinX Pro Pakistan — Official Ad Creative (1080x1080)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070a;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      background: linear-gradient(135deg, #00FF87, #00E65B);
      color: #050a06;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 230, 91, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      box-shadow: 0 6px 20px rgba(0, 230, 91, 0.6);
      transform: translateY(-1px);
    }

    /* 1080x1080 Ad Canvas Container scaled to preview */
    .ad-wrapper {
      width: 540px;
      height: 540px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 230, 91, 0.2);
      border: 2px solid rgba(0, 230, 91, 0.4);
      position: relative;
      background: radial-gradient(circle at 50% 35%, #13241b 0%, #080d0a 50%, #040605 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 24px;
    }

    /* Ambient glow elements */
    .glow-circle {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(0, 230, 91, 0.25) 0%, transparent 70%);
      top: 20%;
      left: 20%;
      filter: blur(40px);
      pointer-events: none;
    }

    /* Top Brand Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }
    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo-wrap img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1.5px solid #00E65B;
      box-shadow: 0 0 15px rgba(0, 230, 91, 0.4);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
    }
    .brand-title span { color: #00E65B; }
    .verified-badge {
      background: rgba(0, 230, 91, 0.15);
      border: 1px solid rgba(0, 230, 91, 0.4);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      color: #00FF87;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main Hook & Hero */
    .ad-body {
      text-align: center;
      z-index: 2;
      margin: auto 0;
    }
    .bonus-tag {
      display: inline-block;
      background: linear-gradient(135deg, #FFE066, #FFB800);
      color: #000;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(255, 184, 0, 0.4);
    }
    .main-heading {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 50%, #00FF87 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .urdu-subheading {
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 20px;
      line-height: 1.8;
      color: #00E65B;
      margin-bottom: 16px;
      text-shadow: 0 2px 10px rgba(0, 230, 91, 0.4);
    }

    /* Feature Pills */
    .feature-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .pill {
      background: rgba(20, 26, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill.highlight {
      border-color: rgba(0, 230, 91, 0.5);
      background: rgba(0, 230, 91, 0.12);
      color: #00FF87;
    }

    /* Bottom Action Area */
    .bottom-bar {
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .cta-banner-btn {
      width: 100%;
      background: linear-gradient(135deg, #00FF87 0%, #00E65B 100%);
      color: #050a06;
      font-weight: 900;
      font-size: 16px;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0, 230, 91, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .payment-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 11px;
      color: #94A3B8;
      font-weight: 600;
    }
    .payment-tag {
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 6px;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="controls">
    <a class="btn" href="/winx-pro-ad-banner.jpg" download="winx-pro-ad-banner.jpg">📥 Download 1080x1080 Ad Image</a>
    <button class="btn" onclick="window.print()">🖨️ Save as PDF / Print</button>
  </div>

  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; max-width: 1200px;">
    <!-- AI Photorealistic Ad Poster -->
    <div style="width: 540px; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 230, 91, 0.25); border: 2px solid rgba(0, 230, 91, 0.4);">
      <img src="/winx-pro-ad-banner.jpg" alt="WinX Pro Ad Poster" style="width: 100%; height: auto; display: block;" />
    </div>

    <!-- HTML Live Responsive Banner -->
    <div class="ad-wrapper" id="adCanvas">
    <div class="glow-circle"></div>

    <!-- Top Brand Bar -->
    <div class="top-bar">
      <div class="brand-logo-wrap">
        <img src="/app-icon.png" alt="WinX Pro" />
        <div class="brand-title">WIN<span>X</span> PRO</div>
      </div>
      <div class="verified-badge">
        <span>🇵🇰</span>
        <span>OFFICIAL PAKISTAN</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="ad-body">
      <div class="bonus-tag">🎁 PKR 8,888 WELCOME REWARDS</div>
      <h1 class="main-heading">
        2 MINUTE INSTANT PAYOUTS
      </h1>
      <div class="urdu-subheading">
        جیتیں روزانہ نقد — پیسے پائیں ۲ منٹ میں!
      </div>

      <div class="feature-row">
        <div class="pill highlight">
          <span>⚡</span>
          <span>Easypaisa &amp; JazzCash</span>
        </div>
        <div class="pill">
          <span>✈️</span>
          <span>Spribe Aviator</span>
        </div>
        <div class="pill">
          <span>🎰</span>
          <span>JILI Slots</span>
        </div>
      </div>
    </div>

    <!-- Bottom CTA Bar -->
    <div class="bottom-bar">
      <a href="/download" class="cta-banner-btn">
        <span>📲</span>
        <span>DOWNLOAD OFFICIAL APP &amp; CLAIM RS 100</span>
      </a>
      <div class="payment-row">
        <span>Accepted:</span>
        <span class="payment-tag">🟢 Easypaisa</span>
        <span class="payment-tag">🔴 JazzCash</span>
        <span class="payment-tag">🏦 Bank Transfer</span>
      </div>
    </div>
  </div>
  </div>

</body>
</html>
