<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WinX • European Roulette VIP</title>
	<link href="./assets/css/style.css" rel="stylesheet" type="text/css">
	<script src="/games/winx-bridge.js"></script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			background: radial-gradient(circle at center, #064e23 0%, #022c14 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow-x: hidden;
		}
		#container {
			background: transparent !important;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: 24px;
			height: auto !important;
			min-height: 520px;
			transform-origin: top center;
		}
		@media (max-width: 960px) {
			#container {
				transform: scale(0.76);
				margin-top: 10px;
			}
		}
		@media (max-width: 540px) {
			#container {
				transform: scale(0.64);
				margin-top: 0;
			}
		}
	</style>
</head>
<body>
	<script src="./assets/js/app.js"></script>
</body>
</html>
