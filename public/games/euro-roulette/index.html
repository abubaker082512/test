<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>WinX • European Roulette 37-Pocket VIP</title>
	<link href="./assets/css/style.css" rel="stylesheet" type="text/css">
	<script src="/games/winx-bridge.js"></script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			background: radial-gradient(circle at 50% 25%, #07381b 0%, #050a12 85%);
			font-family: 'Outfit', 'Inter', system-ui, sans-serif !important;
			width: 100%;
			min-height: 100vh;
			display: flex;
			align-items: flex-start;
			justify-content: center;
			overflow-x: hidden;
			overflow-y: auto;
		}
		#container {
			background: transparent !important;
			display: flex !important;
			flex-direction: column !important;
			align-items: center !important;
			justify-content: flex-start !important;
			gap: 12px;
			height: auto !important;
			padding: 8px 0 36px !important;
			transform: scale(0.82);
			transform-origin: top center;
		}
		.wheel {
			position: relative !important;
			left: auto !important;
			top: auto !important;
			margin: 0 auto 6px !important;
			filter: drop-shadow(0 12px 28px rgba(0,0,0,0.85));
		}
		#betting_board {
			margin: 0 auto !important;
			background: rgba(6, 46, 22, 0.92);
			border: 2px solid rgba(16, 185, 129, 0.45) !important;
			border-radius: 14px;
			box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
		}
		.bankContainer {
			background: rgba(8, 15, 26, 0.95) !important;
			border: 1px solid rgba(16, 185, 129, 0.35) !important;
			border-radius: 10px;
		}
		.bank, .bet {
			color: #34d399 !important;
			font-weight: 900 !important;
		}
		.spinBtn {
			position: fixed !important;
			bottom: 16px !important;
			left: 50% !important;
			transform: translateX(-50%) !important;
			top: auto !important;
			z-index: 50 !important;
			background: linear-gradient(135deg, #10b981, #059669) !important;
			color: #03150e !important;
			font-weight: 900 !important;
			padding: 12px 36px !important;
			border-radius: 999px !important;
			box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5) !important;
			text-transform: uppercase;
			letter-spacing: 0.06em;
		}
	</style>
</head>
<body>
	<script src="./assets/js/app.js"></script>
</body>
</html>
