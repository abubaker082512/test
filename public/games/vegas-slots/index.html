<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WinX • Vegas 20-Line Video Slot</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 20%, #162238 0%, #060a12 75%);
            color: #fff;
            font-family: 'Outfit', 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .winx-cabinet {
            width: 100%;
            min-height: 100dvh;
            padding: 12px 10px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }
        .cabinet-marquee {
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.16) 0%, rgba(8, 15, 26, 0.92) 100%);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 16px;
            padding: 10px 12px;
            text-align: center;
        }
        .marquee-badge {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.12em;
            color: #34d399;
            margin-bottom: 8px;
        }
        .jackpot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .jp-box {
            padding: 6px 4px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .jp-box span { font-size: 9px; font-weight: 800; opacity: 0.85; }
        .jp-box strong { font-size: 13px; font-weight: 900; margin-top: 2px; }
        .jp-grand { background: rgba(245, 158, 11, 0.2); border-color: rgba(251, 191, 36, 0.5); color: #fde68a; }
        .jp-major { background: rgba(16, 185, 129, 0.2); border-color: rgba(52, 211, 153, 0.45); color: #6ee7b7; }
        .jp-minor { background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.4); color: #bae6fd; }
        canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            border: 2px solid rgba(16, 185, 129, 0.45);
            box-shadow: 0 0 32px rgba(16, 185, 129, 0.2);
            margin: 0 auto;
        }
        .cabinet-footer {
            background: rgba(11, 18, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pay-pills {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .pay-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pay-pill span { color: #94a3b8; font-size: 10px; font-weight: 700; }
        .pay-pill b { color: #fbbf24; font-size: 13px; font-weight: 900; margin-top: 2px; }
        .cabinet-tip {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 8px 10px;
            border-radius: 10px;
        }
        .cabinet-tip b { color: #34d399; }
    </style>
    <script src="/games/winx-bridge.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script type="module" src="./src/index.js"></script>
</head>
<body>
    <div class="winx-cabinet" id="vegasCabinet">
        <div class="cabinet-marquee">
            <div class="marquee-badge">🎰 VEGAS 20-PAYLINE VIDEO SLOT</div>
            <div class="jackpot-grid">
                <div class="jp-box jp-grand"><span>20-LINE MAX</span><strong>Rs 200,000</strong></div>
                <div class="jp-box jp-major"><span>5-OF-A-KIND</span><strong>Rs 50,000</strong></div>
                <div class="jp-box jp-minor"><span>BONUS LINE</span><strong>Rs 10,000</strong></div>
            </div>
        </div>
        <div id="vegasStage"></div>
        <div class="cabinet-footer">
            <div class="pay-pills">
                <div class="pay-pill"><span>🎰 Lines</span><b>1–20</b></div>
                <div class="pay-pill"><span>🪙 Coin</span><b>Rs 10–100</b></div>
                <div class="pay-pill"><span>⚡ MaxBet</span><b>200x</b></div>
                <div class="pay-pill"><span>🔄 Auto</span><b>5–100</b></div>
            </div>
            <div class="cabinet-tip">Select <b>LINES</b>, <b>COIN</b>, or <b>MAXBET</b> and tap <b>SPIN</b> on the slot machine!</div>
        </div>
    </div>
</body>
</html>
