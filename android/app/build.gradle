plugins {
    id 'com.android.application'
}

android {
    namespace 'com.winxpro'
    compileSdk 34

    defaultConfig {
        applicationId 'com.winxpro'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue "string", "app_name", "WinX Pro"
        resValue "string", "app_id", "winxpro"
    }

    signingConfigs {
        release {
            storeFile file('winxpro-release-key.jks')
            storePassword 'WinXProReleaseKey2026!'
            keyAlias 'winxpro'
            keyPassword 'WinXProReleaseKey2026!'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}

